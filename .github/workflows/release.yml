name: Build and Release

on:
  push:
    branches:
      - main
      - "26.1"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build ${{ github.ref_name }} and publish JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Collect release JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" release/

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          full_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          release_version="${full_version%%-26.*}"
          if [ -z "$release_version" ] || [ "$release_version" = "$full_version" ]; then
            echo "Unable to derive the shared release version from $full_version" >&2
            exit 1
          fi
          echo "FULL_VERSION=$full_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_version" >> "$GITHUB_ENV"

      - name: Create or update release from main
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f -name '*.jar' | sort)
          title="QuickShulker ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file RELEASE_NOTE.md
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file RELEASE_NOTE.md
          fi

      - name: Append 26.1 JAR to the shared release
        if: github.ref_name == '26.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f -name '*.jar' | sort)
          for attempt in {1..30}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
              exit 0
            fi
            echo "Release $RELEASE_TAG is not available yet (attempt $attempt/30)"
            sleep 10
          done
          echo "Release $RELEASE_TAG was not created by main" >&2
          exit 1
