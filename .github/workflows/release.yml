name: Build and Release

on:
  push:
    branches:
      - main
      - "26.1"
    tags:
      - "[0-9]*"
  pull_request:
    branches:
      - main
      - "26.1"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Microsoft OpenJDK 25
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag and project versions match
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$GITHUB_REF_NAME" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $project_version" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean test runGameTest build --no-daemon --stacktrace

      - name: Verify legacy behavior contract
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one built mod JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          ./gradlew -p legacy-gametest runGameTest \
            -PquickShulkerJar="$PWD/${jars[0]}" \
            -PlegacyBehaviorProfile=current \
            --no-daemon --stacktrace

      - name: Collect release JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Expected exactly one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" release/

      - name: Verify real vanilla, Fabric, original-v3 and v4 clients
        run: bash compat-test/run-matrix.sh release/*.jar

      - name: Upload connection test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: connection-tests-${{ github.ref_name }}
          path: compat-test/build/matrix-results/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: quickshulker-${{ github.ref_name }}
          path: release/*.jar
          if-no-files-found: error

  release:
    name: Release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require the tagged commit to be on its Minecraft branch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            *-26.2) release_branch="main" ;;
            *-26.1) release_branch="26.1" ;;
            *)
              echo "Unsupported Minecraft version in tag $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac
          git fetch origin "$release_branch"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$release_branch"

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: quickshulker-${{ github.ref_name }}
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="QuickShulker $tag"
          prerelease_args=()
          if [[ "$tag" == *-alpha.* || "$tag" == *-beta.* || "$tag" == *-rc.* ]]; then
            prerelease_args+=(--prerelease)
          fi

          mapfile -t files < <(find release -type f -name '*.jar' | sort)
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected exactly one downloaded release JAR, found ${#files[@]}" >&2
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$title" \
              --notes-file RELEASE_NOTE.md \
              "${prerelease_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file RELEASE_NOTE.md \
              "${prerelease_args[@]}"
          fi
