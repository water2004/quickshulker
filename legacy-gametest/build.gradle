plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = '1.0.0'
group = 'net.kyrptonaught.quickshulker.legacytest'

def quickShulkerJar = providers.gradleProperty('quickShulkerJar').orNull
if (quickShulkerJar == null || !file(quickShulkerJar).isFile()) {
    throw new GradleException('Pass -PquickShulkerJar=<Quick Shulker jar>')
}

def behaviorProfile = providers.gradleProperty('legacyBehaviorProfile')
        .orElse('current')
        .get()
if (behaviorProfile != 'baseline-3.0.4' && behaviorProfile != 'current') {
    throw new GradleException(
            'legacyBehaviorProfile must be baseline-3.0.4 or current')
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation files(quickShulkerJar)
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'quickshulker-legacy-contract-gametest'
        enableGameTests = true
        enableClientGameTests = false
        eula = true
        clearRunDirectory = true
    }
}

tasks.named('runGameTest') {
    jvmArgs "-Dquickshulker.legacyBehaviorProfile=${behaviorProfile}"
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
